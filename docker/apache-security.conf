# TravelEase: Apache hardening (enabled by the Dockerfile).
# The project root is the document root, so internal files must be
# denied explicitly. PHP still includes them from disk; only direct web
# requests are refused.

ServerTokens Prod
ServerSignature Off

# Internal folders: code that is only ever included, the database scripts,
# this config, and version-control metadata.
<DirectoryMatch "^/var/www/html/(includes|config|database|docker|\.git|\.github)(/|$)">
    Require all denied
</DirectoryMatch>

# The one page under /includes that is a real URL (post-sign-in redirect).
<Location "/includes/redirect_dashboard.php">
    Require all granted
</Location>

# Documentation, SQL, shell scripts, logs, environment and build files anywhere.
<FilesMatch "(?i)(\.(md|sql|sh|log|ini|ya?ml|lock|dist|bak|conf|example)$|^Dockerfile$|^\.env|^\.git|^\.docker|^composer\.(json|lock)$)">
    Require all denied
</FilesMatch>

# Uploaded files are served as files, never run as PHP.
<Directory "/var/www/html/uploads">
    <FilesMatch "(?i)\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
</Directory>

# Site-wide security headers. setifempty keeps any stricter value a page
# already sends itself (for example the public share page's no-referrer).
<IfModule mod_headers.c>
    Header setifempty X-Frame-Options "DENY"
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
